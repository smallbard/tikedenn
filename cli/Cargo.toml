[package]
name = "tkd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CLI Tikedenn pour les agents (Claude Code, pi) : tâches, prise en charge, worker, déploiement"

[dependencies]
tikedenn-common = { path = "../common" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
