[package]
name = "tikedenn-site"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie-signed"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
askama = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
argon2 = "0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
git2 = { version = "0.21.0", features = ["https"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
tikedenn-common = { path = "../common" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

# Binaire musl (VPS) : OpenSSL compilé en statique pour rester 100% autonome.
[target.'cfg(target_env = "musl")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
