<div id="board" class="board">
  {% for c in columns %}
  <section class="col col-{{ c.status.value }}" data-status="{{ c.status.value }}">
    <header>{{ c.status.label }} <span class="count">{{ c.tasks.len() }}</span></header>
    <div class="col-body">
      {% for task in c.tasks %}
      {% include "task_card.html" %}
      {% else %}
      <p class="empty">No task.</p>
      {% endfor %}
    </div>
  </section>
  {% endfor %}
</div>
