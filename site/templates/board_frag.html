<!-- Rechargé toutes les 20 s (suivi du travail des agents), sauf pendant un
     glisser-déposer. -->
<div id="board" class="board"
     hx-get="/dashboard/board?project={{ selected_project }}"
     hx-trigger="every 20s [!document.querySelector('.dragging')]"
     hx-swap="outerHTML">
  {% for c in columns %}
  <section class="col col-{{ c.status.value }}" id="col-{{ c.status.value }}" data-status="{{ c.status.value }}">
    <header>{{ c.status.label }} <span class="count">{{ c.tasks.len() }}</span></header>
    <div class="col-body">
      {% for task in c.tasks %}
      {% include "task_card.html" %}
      {% else %}
      <p class="empty">No task.</p>
      {% endfor %}
    </div>
  </section>
  {% endfor %}
</div>
