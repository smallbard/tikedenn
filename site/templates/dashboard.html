{% extends "base.html" %}
{% block title %}Dashboard — Tikedenn{% endblock %}
{% block content %}
<h1>Dashboard</h1>

<form method="post" action="/notes" class="noteform"
      hx-post="/notes" hx-target="ul#notes" hx-swap="beforeend"
      hx-on::after-request="if(event.detail.successful) this.reset()">
  <input name="title" placeholder="New note…" required maxlength="200">
  <textarea name="body" placeholder="Content (optional)" rows="3"></textarea>
  <button>Add</button>
</form>

<h2>Notes</h2>
<ul id="notes">
  {{ notes_html|safe }}
  {% if is_empty %}<li class="empty">No notes yet — add the first one above.</li>{% endif %}
</ul>
{% endblock %}
