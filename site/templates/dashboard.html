{% extends "base.html" %}
{% block title %}Tableau de bord — Tikedenn{% endblock %}
{% block content %}
<h1>Tableau de bord</h1>

<form method="post" action="/notes" class="noteform"
      hx-post="/notes" hx-target="ul#notes" hx-swap="beforeend"
      hx-on::after-request="if(event.detail.successful) this.reset()">
  <input name="title" placeholder="Nouvelle note…" required maxlength="200">
  <textarea name="body" placeholder="Contenu (optionnel)" rows="3"></textarea>
  <button>Ajouter</button>
</form>

<h2>Notes</h2>
<ul id="notes">
  {{ notes_html|safe }}
  {% if is_empty %}<li class="empty">Aucune note — ajoutez la première ci-dessus.</li>{% endif %}
</ul>
{% endblock %}
