{% extends "base.html" %}
{% block title %}Board — Tikedenn{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Board</h1>
  <form method="get" class="rowform">
    <select name="project" onchange="this.form.submit()">
      <option value="">All projects</option>
      {% for p in projects %}
      <option value="{{ p.id }}" {% if p.id == selected_project %}selected{% endif %}>{{ p.name }}</option>
      {% endfor %}
    </select>
  </form>
</div>

<a class="page-btn" href="/tasks/new?project={{ selected_project }}">New task</a>

{% include "board_frag.html" %}
{% endblock %}
