{% extends "base.html" %}
{% block title %}Board — Tikedenn{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Board</h1>
  <form method="get" class="rowform">
    <select name="project" onchange="this.form.submit()">
      <option value="">All projects</option>
      {% for p in projects %}
      <option value="{{ p.id }}" {% if p.id == selected_project %}selected{% endif %}>{{ p.name }}</option>
      {% endfor %}
    </select>
    <input type="search" name="q" id="board-search" placeholder="Search tasks…" aria-label="Search tasks" autocomplete="off">
  </form>
</div>

<a class="page-btn" href="/tasks/new?project={{ selected_project }}">New task</a>

<div id="board-wrap" data-show="review">
{% include "board_frag.html" %}
</div>

<!-- Drag & drop : glisser une carte sur une colonne change son état
     (POST /tasks/{id}/move). Événements délégués au document : le tableau
     est remplacé à chaque rafraîchissement htmx. -->
<script>
// Mobile : colonne affichée choisie dans la liste (To review par défaut,
// ou celle de l'ancre #col-…) ; le choix survit aux rafraîchissements.
(function () {
  var wrap = document.getElementById('board-wrap');
  var m = location.hash.match(/^#col-(\w+)$/);
  if (m) wrap.dataset.show = m[1];
  function sync() {
    var pick = wrap.querySelector('.col-picker');
    if (pick) pick.value = wrap.dataset.show;
  }
  sync();
  document.body.addEventListener('htmx:afterSwap', sync);
  window.addEventListener('hashchange', function () {
    var m = location.hash.match(/^#col-(\w+)$/);
    if (m) { wrap.dataset.show = m[1]; sync(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.classList && e.target.classList.contains('col-picker')) wrap.dataset.show = e.target.value;
  });
})();
// Recherche : filtre les cartes affichées au fil de la saisie (tous les mots,
// sans tenir compte de la casse ni des accents ; numéro, titre, début de la
// description, tags). Côté navigateur seulement, réappliquée après chaque
// rafraîchissement du tableau ; gardée dans l'URL (?q=).
(function () {
  var input = document.getElementById('board-search');
  var wrap = document.getElementById('board-wrap');
  function norm(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  input.value = new URLSearchParams(location.search).get('q') || '';
  function apply() {
    var words = norm(input.value).split(/\s+/).filter(Boolean);
    wrap.querySelectorAll('.col').forEach(function (col) {
      var shown = 0;
      col.querySelectorAll('.card.task').forEach(function (card) {
        var text = '';
        card.querySelectorAll('.card-head, .card-tags, .card-desc').forEach(function (el) { text += ' ' + el.textContent; });
        text = norm(text);
        var ok = words.every(function (w) { return text.indexOf(w) >= 0; });
        card.hidden = !ok;
        if (ok) shown++;
      });
      // Séparateur « en attente » : masqué s'il ne reste aucune carte après lui.
      var sep = col.querySelector('.col-sep');
      if (sep) {
        var after = false;
        for (var n = sep.nextElementSibling; n; n = n.nextElementSibling)
          if (n.classList.contains('task') && !n.hidden) { after = true; break; }
        sep.hidden = !after;
      }
      var total = col.querySelectorAll('.card.task').length;
      var label = words.length && total ? shown + '/' + total : String(total);
      var count = col.querySelector('header .count');
      if (count) count.textContent = label;
      var opt = wrap.querySelector('.col-picker option[value="' + col.dataset.status + '"]');
      if (opt) opt.textContent = opt.textContent.replace(/\([^)]*\)$/, '(' + label + ')');
      var none = col.querySelector('.no-match');
      if (words.length && total && !shown) {
        if (!none) {
          none = document.createElement('p');
          none.className = 'empty no-match';
          none.textContent = 'No matching task.';
          col.querySelector('.col-body').appendChild(none);
        }
      } else if (none) none.remove();
    });
  }
  input.addEventListener('input', function () {
    var u = new URL(location.href);
    if (input.value) u.searchParams.set('q', input.value); else u.searchParams.delete('q');
    history.replaceState(null, '', u);
    apply();
  });
  // Entrée ne recharge pas la page.
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });
  document.body.addEventListener('htmx:afterSwap', apply);
  apply();
})();
(function () {
  function colOf(e) { return e.target.closest && e.target.closest('#board .col'); }
  document.addEventListener('dragstart', function (e) {
    var card = e.target.closest && e.target.closest('#board .card.task');
    if (!card) return;
    e.dataTransfer.setData('text/plain', card.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
  });
  document.addEventListener('dragend', function (e) {
    var card = e.target.closest && e.target.closest('.card.task');
    if (card) card.classList.remove('dragging');
  });
  document.addEventListener('dragover', function (e) {
    var col = colOf(e);
    if (!col) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    col.classList.add('drag-over');
  });
  document.addEventListener('dragleave', function (e) {
    var col = colOf(e);
    if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over');
  });
  document.addEventListener('drop', async function (e) {
    var col = colOf(e);
    if (!col) return;
    e.preventDefault();
    col.classList.remove('drag-over');
    var id = e.dataTransfer.getData('text/plain');
    if (!id) return;
    var body = new URLSearchParams();
    body.set('status', col.dataset.status);
    var r = await fetch('/tasks/' + id + '/move', {
      method: 'post',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString(),
    });
    if (r.ok) location.reload();
    else alert((await r.text()) || 'Move failed.');
  });
})();
</script>
{% endblock %}
