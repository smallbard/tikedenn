<div class="card task t-{{ task.status }}" draggable="true" data-id="{{ task.id }}" data-filter="{{ filter }}">
  <div class="card-head">
    <strong class="card-title grow">{{ task.title }}</strong>
    {% if let Some(p) = task.project %}
    <span class="tag" {% if !p.git_repo.is_empty() %}title="{{ p.git_repo }}"{% endif %}>{{ p.name }}</span>
    {% endif %}
  </div>
  {% if !task.description_preview.is_empty() %}
  <p class="card-desc">{{ task.description_preview }}</p>
  {% endif %}
  <div class="card-actions">
    <a class="linklike" href="/tasks/{{ task.id }}/edit?project={{ filter }}">Edit</a>
  </div>
</div>
