{% extends "base.html" %}
{% block title %}New task — Tikedenn{% endblock %}
{% block content %}
<div class="page-head">
  <h1>New task</h1>
</div>

{% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}

<form method="post" action="/tasks" class="new-task">
  <input type="hidden" name="filter" value="{{ selected_project }}">
  <input name="title" placeholder="Task title…" required maxlength="200" class="grow" autofocus>
  <div class="field-row">
    <label>Project
      <select name="project">
        <option value="0">No project</option>
        {% for p in projects %}
        <option value="{{ p.id }}" {% if p.id == selected_project %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Priority
      <select name="priority">
        {% for p in priorities %}
        <option value="{{ loop.index0 }}" {% if loop.index0 == 1 %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Depends on (task ids)
      <input name="depends_on" placeholder="e.g. 12, 15">
    </label>
  </div>
  <input name="branch" placeholder="Git branch (optional — agents create task/<id>-… if empty)" maxlength="200" class="grow">
  <textarea name="description" rows="6" placeholder="Description / full specification (what the agent must do)"></textarea>
  <textarea name="acceptance" rows="3" placeholder="Acceptance criteria (what the review will check)"></textarea>
  <button type="submit" name="status" value="draft">Create in Draft</button>
  <button type="submit" name="status" value="todo">Create in To do</button>
  <a class="linklike" href="/dashboard?project={{ selected_project }}">Cancel</a>
</form>
<p class="empty">Create in Draft to keep refining the task, or directly in <em>To do</em> when it is ready for an agent.</p>
{% endblock %}
