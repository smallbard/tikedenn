{% extends "base.html" %}
{% block title %}New task — Tikedenn{% endblock %}
{% block content %}
<div class="page-head">
  <h1>New task</h1>
</div>

{% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}

<form method="post" action="/tasks" class="new-task">
  <input type="hidden" name="filter" value="{{ selected_project }}">
  <input name="title" placeholder="Task title…" required maxlength="200" class="grow" autofocus>
  <select name="project">
    <option value="0">No project</option>
    {% for p in projects %}
    <option value="{{ p.id }}" {% if p.id == selected_project %}selected{% endif %}>{{ p.name }}</option>
    {% endfor %}
  </select>
  <textarea name="description" rows="5" placeholder="Description / full specification (optional)"></textarea>
  <button type="submit">Create in Draft</button>
  <a class="linklike" href="/dashboard?project={{ selected_project }}">Cancel</a>
</form>
{% endblock %}
